<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f1220">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<title>Keys</title>
<style>
:root{--bg:#0f1220;--panel:#171b2e;--panel2:#20263f;--line:#2c3354;--text:#e8eaf6;--muted:#8b90b0;--accent:#7c8cff;--left:#ffb35c;--good:#3ddc97;--bad:#ff5c7a;--star:#ffd166}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font:14px/1.35 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow:hidden}
#app{display:flex;flex-direction:column;height:100dvh}
header{background:var(--panel);padding:6px 8px;padding-left:max(8px,env(safe-area-inset-left));padding-right:max(8px,env(safe-area-inset-right))}
.row{display:flex;gap:6px;align-items:center;overflow-x:auto;white-space:nowrap;scrollbar-width:none}
.row::-webkit-scrollbar{display:none}
select,button{background:var(--panel2);color:var(--text);border:1px solid var(--line);border-radius:8px;padding:7px 10px;font:inherit;cursor:pointer;flex:none}
button[aria-pressed="false"]{opacity:.45}
button:disabled{opacity:.4;cursor:default}
.primary{background:var(--accent);border-color:var(--accent);color:#0b0e1a;font-weight:600;min-width:84px}
.homebtn{border-color:var(--accent);color:var(--accent);font-weight:600}
.chip.on{border-color:var(--good);color:var(--good)}
main{position:relative;flex:1;min-height:0}
canvas{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
#hud{position:absolute;top:10px;left:12px;right:12px;font-weight:600;font-variant-numeric:tabular-nums;pointer-events:none;text-shadow:0 1px 3px #000}
#hud small{display:block;color:var(--muted);font-weight:400}
#hud .tip{color:var(--text);opacity:.8;max-width:520px;white-space:normal}
#hud .sess{color:var(--accent);font-weight:600}
#msg{position:absolute;left:16px;right:16px;top:30%;text-align:center;color:var(--muted);font-size:18px;pointer-events:none}
.overlay{position:absolute;inset:0;display:flex;background:rgba(10,12,22,.8);padding:12px 16px;overflow:auto;z-index:5}
.card{background:var(--panel);border-radius:14px;padding:18px 22px;text-align:center;min-width:240px;max-width:560px;margin:auto}
.card .big{font-size:44px;font-weight:700;color:var(--good);line-height:1.1}
.card p{color:var(--muted);margin:6px 0 12px}
.card .xp{color:var(--star);font-weight:700;margin-top:2px}
.card .count{color:var(--accent);font-size:13px;min-height:18px;margin-bottom:6px}
.card ul{list-style:none;padding:0;margin:8px 0 14px;text-align:left;color:var(--text)}
.card li{display:flex;gap:8px;padding:3px 0;border-bottom:1px solid var(--line)}
.card li span:last-child{margin-left:auto;font-variant-numeric:tabular-nums}
.btns{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.stars{color:var(--star);font-size:26px;letter-spacing:2px}
.stars .off{color:#3a4064}

/* Transport: playback controls and timeline */
#transport{display:flex;align-items:center;gap:6px;background:var(--panel);border-top:1px solid var(--line);padding:3px 8px 4px;padding-left:max(8px,env(safe-area-inset-left));padding-right:max(8px,env(safe-area-inset-right))}
#transport.off{opacity:.35;pointer-events:none}
#transport button{padding:5px 9px;flex:none}
.ic{display:inline-flex;align-items:center;justify-content:center;gap:6px}
.ic svg{width:18px;height:18px;flex:none;display:block}
#transport .ic:not(#play):not(.loopchip){padding:6px 8px}
#transport #play{min-width:92px}
.tt{flex:none;min-width:36px;text-align:center;color:var(--muted);font-size:12px;font-variant-numeric:tabular-nums}
#tl{flex:1;min-width:70px;height:34px;display:flex;align-items:center;cursor:pointer;touch-action:none;outline:none}
#tlTrack{position:relative;width:100%;height:6px;background:var(--panel2);border-radius:3px}
#tlFill{position:absolute;left:0;top:0;bottom:0;width:0;background:var(--accent);border-radius:3px}
#tlLoop{position:absolute;top:-4px;bottom:-4px;background:rgba(61,220,151,.18);border:1px solid var(--good);border-radius:4px}
#tlThumb{position:absolute;top:50%;left:0;width:16px;height:16px;margin:-8px 0 0 -8px;border-radius:50%;background:#fff;box-shadow:0 1px 4px rgba(0,0,0,.5);transition:transform .12s}
#tl.drag #tlThumb,#tl:hover #tlThumb{transform:scale(1.25)}
.tmark{position:absolute;top:-7px;width:16px;height:20px;margin-left:-8px;cursor:pointer}
.tmark::before{content:"";position:absolute;left:6.5px;top:0;width:3px;height:20px;border-radius:2px;background:var(--mc,var(--star))}
.mdot{display:inline-block;flex:none;width:9px;height:9px;border-radius:50%;background:var(--mc);margin-right:6px;vertical-align:middle;box-shadow:0 0 0 1px rgba(0,0,0,.25)}
.loopchip{border-color:var(--good)!important;color:var(--good);font-size:13px;max-width:180px;overflow:hidden;text-overflow:ellipsis}
@media (max-width:640px){ #transport{flex-wrap:wrap;row-gap:0} #transport #play{min-width:44px} #tl{order:9;flex-basis:100%;height:28px} #tDur{margin-left:auto} }

.notice{background:rgba(255,179,92,.12);border:1px solid var(--left);color:var(--text);border-radius:10px;padding:10px 12px;margin:4px 0 10px}

.sechead{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:18px 0 8px}
.sechead h2.sec{margin:0;flex:1;min-width:160px}
.search.catq{width:min(260px,100%);margin:0;padding:6px 10px;font-size:13px}

/* Mistake heatmap */
.heat{margin:8px 0 10px;text-align:left}
.heat summary{cursor:pointer;color:var(--accent);font-weight:600;list-style:none}
.heat summary::-webkit-details-marker{display:none}
.heatbar{display:flex;gap:2px;height:40px;margin:10px 0 4px}
.heatbar .hc{flex:1 1 0;min-width:2px;padding:0;border:0;border-radius:3px;background:rgba(255,92,122,calc(.1 + var(--h)*.9));cursor:pointer}
.heatbar .hc[data-none]{background:var(--panel2)}
.heatbar .hc:hover{outline:2px solid var(--text);outline-offset:-1px}
.heatax{display:flex;justify-content:space-between;font-size:11px;color:var(--muted);margin-bottom:6px}
.hs{border-color:var(--bad)}
.small{font-size:12px}

/* Recording */
.rec svg{color:var(--bad)}
.rec.on{border-color:var(--bad);color:var(--bad);font-variant-numeric:tabular-nums}
.rec.on svg{animation:recpulse 1s ease-in-out infinite}
@keyframes recpulse{50%{opacity:.35}}
.replaychip{border-color:var(--bad)!important;color:var(--bad)}
.reclist{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:4px 12px;margin-bottom:6px}
.reclist .mrow{margin:0}

/* Saved parts menu */
.pop{position:fixed;z-index:9;right:8px;width:min(380px,calc(100vw - 16px));max-height:70vh;overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:14px;box-shadow:0 10px 30px rgba(0,0,0,.5);padding:12px}
.pop .phead{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.pop .phead div{flex:1;min-width:0}
.pop .phead small{display:block;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pop .phead button{background:transparent;border-color:transparent}
.mrow{display:flex;gap:4px;align-items:center;margin:4px 0}
.mrow .mgo{flex:1;min-width:0;text-align:left;display:flex;gap:8px;align-items:center;white-space:nowrap;overflow:hidden}
.mrow .mgo b{font-weight:600;overflow:hidden;text-overflow:ellipsis}
.mrow .mgo small{margin-left:auto;color:var(--muted);font-variant-numeric:tabular-nums}
.mrow button{padding:6px 9px}
.mrow .mgo{justify-content:flex-start}
.mrow .mgo svg{width:13px;height:13px}
.mrow .on{border-color:var(--good);color:var(--good)}
.mrow input{flex:1;min-width:0}
.madd{display:flex;gap:6px;margin-top:10px;padding-top:10px;border-top:1px solid var(--line)}
.madd input,.mrow input{background:var(--bg);color:var(--text);border:1px solid var(--line);border-radius:8px;padding:7px 10px;font:inherit}
.madd input{flex:1;min-width:0}
.marks{display:flex;flex-wrap:wrap;gap:6px;margin:4px 0 10px}

/* Full screens (Home, Lessons, Practice, Progress) */
#screen{position:fixed;inset:0;background:var(--bg);overflow:auto;z-index:10;padding:0 max(16px,env(safe-area-inset-right)) 28px max(16px,env(safe-area-inset-left))}
.snav{position:sticky;top:0;z-index:2;background:var(--bg);display:flex;gap:6px;align-items:center;padding:10px 0;overflow-x:auto;scrollbar-width:none}
.snav::-webkit-scrollbar{display:none}
.snav button{background:transparent;border-color:transparent}
.snav button.on{background:var(--panel2);border-color:var(--line);color:var(--accent);font-weight:600}
.snav .sp{flex:1}
.snav .kb{border-color:var(--line)}
h2.sec{font-size:13px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);margin:18px 0 8px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:12px}
.box{background:var(--panel);border-radius:14px;padding:14px}
.box h3{margin:0 0 4px;font-size:16px}
.box p{color:var(--muted);margin:2px 0 10px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0 10px}
.chips button{padding:6px 10px;font-size:13px}
.chips button.on{border-color:var(--accent);color:var(--accent);font-weight:600}
.muted{color:var(--muted)}

/* Home */
.hero{display:flex;gap:14px;align-items:center;flex-wrap:wrap;background:var(--panel);border-radius:14px;padding:14px}
.hero .lv{flex:1;min-width:200px}
.hero .lv b{font-size:18px}
.xpbar{height:8px;background:var(--panel2);border-radius:4px;overflow:hidden;margin:6px 0 3px}
.xpbar i{display:block;height:100%;background:var(--star);border-radius:4px}
.pill{display:flex;flex-direction:column;align-items:center;min-width:72px}
.pill b{font-size:22px;font-variant-numeric:tabular-nums}
.pill small{color:var(--muted);font-size:12px}
.ring{position:relative;width:64px;height:64px}
.ring span{position:absolute;inset:0;display:grid;place-items:center;font-weight:700;font-size:13px;text-align:center;line-height:1.1}
.ring span small{display:block;font-weight:400;color:var(--muted);font-size:10px}
.today{border:1px solid var(--accent)}
.today h3{font-size:20px}
.tile{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:12px;background:var(--panel);border-radius:14px;border:1px solid var(--line);white-space:normal}
.tile .ic{font-size:26px;flex:none}
.tile b{display:block}
.tile small{color:var(--muted)}
.tiles{display:grid;gap:10px}

/* Lessons */
.course h3{margin:0;font-size:16px}
.course .sub{color:var(--muted);margin:2px 0 8px;font-size:13px}
.bar{height:4px;background:var(--panel2);border-radius:2px;overflow:hidden;margin-bottom:8px}
.bar i{display:block;height:100%;background:var(--good)}
.lesson{display:flex;align-items:center;gap:10px;width:100%;text-align:left;margin:5px 0;padding:8px 10px;white-space:normal}
.lesson .num{flex:none;width:24px;height:24px;border-radius:50%;display:grid;place-items:center;background:var(--bg);color:var(--muted);font-size:12px;font-weight:700}
.lesson.done .num{background:var(--good);color:#0b0e1a}
.lesson.next{border-color:var(--accent)}
.lesson.next .num{background:var(--accent);color:#0b0e1a}
.lesson .t{flex:1}
.lesson .s{color:var(--star);font-size:12px;letter-spacing:1px}
.lesson .due{color:var(--left);font-size:12px}

/* Songs */
.search{width:100%;background:var(--panel);color:var(--text);border:1px solid var(--line);border-radius:10px;padding:10px 12px;font:inherit;font-size:15px;margin:4px 0 8px}
.search:focus{outline:none;border-color:var(--accent)}
.songs{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:8px}
.song{display:flex;align-items:center;gap:10px;width:100%;text-align:left;padding:10px 12px;white-space:normal}
.song .t{flex:1;min-width:0}
.song b{display:block;font-weight:600}
.song small{color:var(--muted);font-size:12px}
.song .s{color:var(--star);font-size:12px;letter-spacing:1px;text-align:right;flex:none}
.song .s small{display:block;letter-spacing:0}
.song .lvl{color:var(--accent);font-size:11px;letter-spacing:1px;flex:none}

/* Progress */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}
.stat{background:var(--panel);border-radius:12px;padding:10px 12px}
.stat b{display:block;font-size:22px;font-variant-numeric:tabular-nums}
.stat small{color:var(--muted)}
.chart{position:relative;display:flex;align-items:flex-end;gap:2px;height:140px;padding-top:18px}
.chart .col{flex:1;height:100%;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;position:relative;cursor:default}
.chart .b{width:70%;max-width:26px;background:var(--accent);border-radius:4px 4px 0 0;min-height:0}
.chart .col.zero .b{background:var(--panel2);min-height:2px}
.chart .v{position:absolute;top:-16px;font-size:11px;color:var(--text);opacity:0;white-space:nowrap;pointer-events:none}
.chart .col:hover .v,.chart .col.today .v{opacity:1}
.chart .col:hover .b{filter:brightness(1.2)}
.chart .goal{position:absolute;left:0;right:0;border-top:1px dashed var(--muted);opacity:.6;pointer-events:none}
.chart .goal span{position:absolute;right:0;top:-15px;font-size:10px;color:var(--muted)}
.xlab{display:flex;gap:2px;margin-top:4px}
.xlab span{flex:1;text-align:center;font-size:10px;color:var(--muted)}
.xlab span.today{color:var(--text);font-weight:700}
.sk{display:flex;align-items:center;gap:10px;margin:6px 0}
.sk span:first-child{width:170px;flex:none}
.sk .bar{flex:1;margin:0;height:8px;border-radius:4px}
.sk .bar i{background:var(--accent)}
.sk span:last-child{width:44px;text-align:right;color:var(--muted);font-variant-numeric:tabular-nums}
.achs{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.ach{background:var(--panel);border-radius:12px;padding:10px;display:flex;gap:8px;align-items:center}
.ach .i{font-size:24px}
.ach b{display:block;font-size:13px}
.ach small{color:var(--muted);font-size:11px}
.ach.lock{opacity:.4;filter:grayscale(1)}
.hist{list-style:none;margin:0;padding:0}
.hist li{display:flex;gap:10px;padding:6px 0;border-bottom:1px solid var(--line)}
.hist li span:nth-child(2){flex:1}
.hist .muted{font-variant-numeric:tabular-nums}

/* Lesson intro */
#intro{position:fixed;z-index:11}
.intro{text-align:left}
.intro .kicker{color:var(--accent);font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.06em}
.intro h2{margin:4px 0 6px;font-size:22px}
.intro p{color:var(--text);opacity:.85;margin:6px 0}
.mini{margin:12px 0;overflow-x:auto;text-align:center}
.mini svg{max-width:100%;height:auto}
.meta{color:var(--muted);font-size:13px;margin:6px 0 12px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;margin:4px 0 10px}
.seg button{border:0;border-radius:0;background:transparent;opacity:1}
.seg button.on{background:var(--panel2);color:var(--accent);font-weight:600}
.intro .btns{justify-content:flex-start;position:sticky;bottom:-18px;background:var(--panel);padding:10px 0 4px;margin:8px 0 0;z-index:1}
.theory{margin:10px 0 4px;border-top:1px solid var(--line);padding-top:8px}
.theory summary{cursor:pointer;color:var(--accent);font-weight:600;display:inline-flex;align-items:center;gap:6px;list-style:none}
.theory summary::-webkit-details-marker{display:none}
.theory summary svg{width:18px;height:18px}
.theory h3{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:14px 0 4px}
.theory ul{margin:4px 0;padding-left:20px;list-style:disc}
.theory li{display:list-item;border:0;padding:0;margin:4px 0;opacity:.9}
.theory p{line-height:1.45}

.tracks{display:flex;flex-direction:column;gap:6px;margin:0 0 12px}
.tracks label{display:flex;gap:6px;align-items:center}
.tracks small{color:var(--muted)}
.search.title{font-size:20px;font-weight:700;margin:4px 0 2px}

/* Players */
#who{position:fixed;z-index:12;background:rgba(10,12,22,.92)}
.whocard{max-width:640px;width:100%}
.whocard h2{margin:0 0 14px}
.ptiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px;margin-bottom:12px}
.ptile{position:relative}
.ptile .pick{width:100%;height:100%;display:flex;flex-direction:column;align-items:center;gap:4px;padding:16px 10px 12px;white-space:normal;border-radius:14px}
.ptile.on .pick{border-color:var(--accent)}
.ptile .pick b{font-size:16px}
.ptile .pick small{color:var(--muted);font-size:12px}
.ptile .add{border-style:dashed;opacity:.85}
.ptile .edit{position:absolute;top:6px;right:6px;padding:3px 8px;font-size:13px;background:transparent;border-color:transparent}
.avatar{font-size:36px;line-height:1.1}
.hero .avatar{font-size:40px}
.avatars{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin:4px 0 14px}
.avatars button{font-size:24px;padding:4px 8px}
.avatars button.on{border-color:var(--accent);background:var(--panel)}
.danger{color:var(--bad);border-color:var(--bad)}

/* Toasts */
#toasts{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);z-index:20;display:flex;flex-direction:column;gap:6px;align-items:center;pointer-events:none;width:max-content;max-width:calc(100vw - 32px)}
.toast{background:var(--panel2);border:1px solid var(--accent);color:var(--text);padding:8px 14px;border-radius:10px;box-shadow:0 6px 20px rgba(0,0,0,.4);font-weight:600;animation:tin .25s ease-out}
@keyframes tin{from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:none}}
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="row">
      <button id="homeBtn" class="homebtn">🏠 Menu</button>
      <button id="whoBtn"></button>
      <button id="songsBtn">🎵 Songs</button>
      <select id="mode" aria-label="Mode">
        <option value="wait">Wait for me</option>
        <option value="play">Play along</option>
        <option value="listen">Listen</option>
      </select>
      <select id="hands" aria-label="Hands">
        <option value="both">Both hands</option>
        <option value="right">Right hand</option>
        <option value="left">Left hand</option>
      </select>
      <select id="speed" aria-label="Speed"></select>
      <button id="lessonBtn" class="ic" hidden title="Read this lesson again" aria-label="Read this lesson again"></button>
      <button id="marksBtn" class="ic" title="Saved parts: jump to, loop or save a part of this song" aria-label="Saved parts"></button>
      <button id="recBtn" class="ic rec" title="Record yourself, to replay later" aria-label="Record"></button>
      <button id="metro" aria-pressed="false" title="Metronome">🥁</button>
      <button id="sound" aria-pressed="false" title="Hear the song while playing along">🔊</button>
      <select id="labels" aria-label="Size of note names and finger numbers" title="Size of note names and finger numbers"></select>
      <button id="fs" title="Fullscreen">⛶</button>
      <button id="midi" class="chip">Connect piano</button>
    </div>
  </header>
  <div id="transport" class="off">
    <button id="tStart" class="ic" title="Back to the start (Home)" aria-label="Back to the start"></button>
    <button id="tBack" class="ic" title="Back 5 seconds (←)" aria-label="Back 5 seconds"></button>
    <button id="play" class="primary ic"></button>
    <button id="tFwd" class="ic" title="Forward 5 seconds (→)" aria-label="Forward 5 seconds"></button>
    <span class="tt" id="tCur">0:00</span>
    <div id="tl" role="slider" aria-label="Position in the song" tabindex="-1"><div id="tlTrack"><div id="tlLoop" hidden></div><div id="tlFill"></div><div id="tlMarks"></div><div id="tlThumb"></div></div></div>
    <span class="tt" id="tDur">0:00</span>
    <button id="tLoop" class="loopchip ic" hidden title="Stop looping"></button>
    <button id="tReplay" class="loopchip replaychip ic" hidden title="Stop the replay"></button>
    <button id="tMark" class="ic" title="Save this spot as a part" aria-label="Save this spot as a part"></button>
  </div>
  <main>
    <canvas id="cv"></canvas>
    <div id="hud"></div>
    <div id="msg"></div>
    <div id="result" class="overlay" hidden>
      <div class="card" id="resCard">
        <div id="resTitle"></div>
        <div id="resStars" class="stars"></div>
        <div class="big" id="resAcc"></div>
        <div class="xp" id="resXP"></div>
        <p id="resDetail"></p>
        <div class="count" id="resCount"></div>
        <div class="btns" id="resBtns"></div>
      </div>
    </div>
  </main>
</div>
